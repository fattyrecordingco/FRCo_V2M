[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2m-software"
version = "0.1.0.dev0"
description = "Local-first AI-assisted MIDI ideation tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10.2",
    "mido>=1.3.2",
    "numpy>=1.26.0",
    "openai>=1.58.1",
    "soundfile>=0.12.1",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
v2m = "v2m.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
