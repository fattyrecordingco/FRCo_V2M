name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build MSI
        working-directory: frontend
        run: npx tauri build --bundles msi

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: vins-windows-msi
          path: frontend/src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: Build macOS App + DMG
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Import Apple certificate
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_CERTIFICATE_PASSWORD != '' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/apple_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Build signed/notarized macOS bundles
        working-directory: frontend
        env:
          CI: "true"
        run: npx tauri build --bundles app,dmg

      - name: Zip .app bundle for download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/src-tauri/target/release/bundle/macos-zip
          for app in frontend/src-tauri/target/release/bundle/macos/*.app; do
            app_name="$(basename "$app")"
            zip_path="frontend/src-tauri/target/release/bundle/macos-zip/${app_name}.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"
          done

      - name: Staple and verify notarization
        if: ${{ env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for app in frontend/src-tauri/target/release/bundle/macos/*.app; do
            xcrun stapler staple "$app"
            spctl -a -t exec -vv "$app"
          done
          for dmg in frontend/src-tauri/target/release/bundle/dmg/*.dmg; do
            xcrun stapler staple "$dmg"
            spctl -a -t open --context context:primary-signature -vv "$dmg"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vins-macos-bundles
          path: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/macos-zip/*.zip

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: vins-windows-msi
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: vins-macos-bundles
          path: release-assets/macos

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*.msi
            release-assets/macos/*.dmg
            release-assets/macos/*.zip
