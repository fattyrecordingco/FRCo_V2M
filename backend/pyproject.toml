[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "vins-backend"
version = "0.1.4"
description = "VINS local-first audio-to-MIDI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.18",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.1",
  "numpy>=2.1.3",
  "scipy>=1.14.1",
  "librosa>=0.10.2.post1",
  "soundfile>=0.12.1",
  "pretty-midi>=0.2.10",
  "mido>=1.3.2",
  "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=6.0.0",
  "httpx>=0.27.2",
  "ruff>=0.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP"]
ignore = ["B008", "UP042"]
